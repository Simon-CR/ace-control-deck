# =========================================================================
# ACE Control Deck & multiACE Reference Macro Suite
# =========================================================================
# An authoritative, modular Klipper configuration reference for integrating
# the Anycubic ACE 2 Pro multi-material system with Klipper via `decay71/multiACE`.
#
# Supported Platform Profiles:
# -------------------------------------------------------------------------
# • Profile 1: Voron / Single-Toolhead Combiner (CoreXY / Flying Gantry)
#     - 4-to-1 Hub merger junction with deterministic 50mm staged parking.
#     - Supports Tier 1 (Minimal / Blind), Tier 2 (Standard Hub+Entry),
#       and Tier 3 (High-Reliability Post-Gear Bite + Cut Witness).
#     - Mechanical tip cutting (CROSSBOW / ERCF cutter) or thermal ramming.
#
# • Profile 2: Snapmaker U1 Tool-Changer
#     - Head Mode: 1:1 dedicated direct Bowden paths (~2100mm) from ACE slots 0..3
#       to individual toolheads E0..E3. Filaments remain staged/primed in toolheads;
#       toolchanges execute physical head docking, hot seat press sealing, and pickup.
#     - Combiner Mode: Upstream 4-to-1 merger feeding into toolhead changer gantry.
#
# =========================================================================

# -------------------------------------------------------------------------
# Centralized Configuration & Profile Selector
# -------------------------------------------------------------------------
[gcode_macro _ACE_VARS]
description: Global configuration variables for ACE Control Deck macro suite

# -------------------------------------------------------------------------
# PLATFORM PROFILE SELECTION:
#   "voron"        = Profile 1: Voron / CoreXY Single-Toolhead Combiner
#   "snapmaker_u1" = Profile 2: Snapmaker U1 Tool-Changer
# -------------------------------------------------------------------------
variable_platform_profile: "voron"

# -------------------------------------------------------------------------
# SENSOR TOPOLOGY TIER (For Voron / Combiner Mode):
#   1 = Minimal (1 Toolhead Sensor, Blind Feed, ACE Bay Parking)
#   2 = Standard (Hub + Toolhead Entry, 50mm Staged Hub Parking)
#   3 = High-Reliability (Hub + Entry + Post-Gear, 4-Stage Speeds, Cut Witness)
# -------------------------------------------------------------------------
variable_tier: 3

# -------------------------------------------------------------------------
# SNAPMAKER U1 SPECIFIC CONFIGURATION:
#   u1_mode:
#     "head"     = 1:1 Direct Feed Mode (ACE Slots 0..3 -> Toolheads 0..3)
#     "combiner" = Merger Mode (4-to-1 Hub feeding active toolhead)
# -------------------------------------------------------------------------
variable_u1_mode: "head"
variable_u1_bowden_len: 2100.0         # 2100mm long Bowden tube from ACE to U1 toolheads
variable_u1_hot_seat_temp_offset: 15.0 # Temperature drop while parked on hot seat dock (°C)
variable_u1_dock_positions: [
    [10.0, 310.0],   # Head 0 Dock [X, Y]
    [70.0, 310.0],   # Head 1 Dock [X, Y]
    [130.0, 310.0],  # Head 2 Dock [X, Y]
    [190.0, 310.0]   # Head 3 Dock [X, Y]
]

# Sensor Object Names (must match [filament_*_sensor ...] sections in your cfg)
variable_sensor_hub: "filament_switch_sensor hub_detect"
variable_sensor_entry: "filament_switch_sensor toolhead_entry"
variable_sensor_postgear: "filament_switch_sensor toolhead_postgear"

# Physical & Calibrated Bowden Distances for Voron / Combiner (mm)
variable_bowden_len: 555.9             # Shared reverse Bowden length: Hub merger collet to toolhead entry
variable_hub_park_offset: 50.0          # Staged park offset backed off from hub merger junction
variable_lane_lengths: [934.0, 944.0, 954.0, 904.0]  # ACE bay to hub merger per slot (T0-T3)
variable_entry_to_postgear: 20.0       # Extruder inlet guide path to post-gear sensor trigger
variable_postgear_to_nozzle: 80.0      # Functional purge stroke: post-gear engagement to molten nozzle flow
variable_cutter_blade_offset: 5.6      # Distance from post-gear sensor to cutter blade edge
variable_blade_to_nozzle: 46.1         # Geometric distance from blade to nozzle tip
variable_blind_feed_margin: 25.0       # Extra engagement safety feed for Tier 1 blind mode

# Velocity Profiles (mm/s)
variable_speed_bulk: 90.0              # 90 mm/s: Fast spool bay transit
variable_speed_funnel: 30.0            # 30 mm/s: Funnel entrance deceleration into 4-to-1 merger
variable_speed_bowden: 85.0            # 85 mm/s: High-speed reverse Bowden transit
variable_speed_bite: 15.0              # 15 mm/s: Synchronous extruder bite engagement
variable_speed_retract: 60.0           # 60 mm/s: Rollback assist retract speed

# Mechanical Cutting Coordinates (Voron Trident / CoreXY Reference)
variable_cut_x: 18.0                   # X position above cutting pin on frame
variable_cut_y: 305.0                  # Y position against frame stop
variable_cut_pin_x: -4.0               # X coordinate to fully compress cutter arm
variable_cut_retract_dist: 38.1        # Retract distance prior to cutting move to align cut zone
variable_post_cut_retract: 25.0        # Retraction stroke after cut to back filament out of gears

# Operational State Tracking
variable_current_slot: -1              # Currently active slot (-1 = none loaded)
variable_swapping: 0                   # 1 during toolchange to suppress spurious runout triggers

gcode:
    M118 [ACE_VARS] Profile: {printer["gcode_macro _ACE_VARS"].platform_profile} | Tier: {printer["gcode_macro _ACE_VARS"].tier} | Slot: {printer["gcode_macro _ACE_VARS"].current_slot}


# -------------------------------------------------------------------------
# Tool Mapping Shims (T0 - T3)
# -------------------------------------------------------------------------
# Standard G-code tool selectors for slicer integration.
# Maps T0-T3 commands to the orchestrator macro.
# -------------------------------------------------------------------------
[gcode_macro T0]
description: Select ACE Slot 0 / Toolhead 0
gcode:
    _ACE_TOOLCHANGE TOOL=0

[gcode_macro T1]
description: Select ACE Slot 1 / Toolhead 1
gcode:
    _ACE_TOOLCHANGE TOOL=1

[gcode_macro T2]
description: Select ACE Slot 2 / Toolhead 2
gcode:
    _ACE_TOOLCHANGE TOOL=2

[gcode_macro T3]
description: Select ACE Slot 3 / Toolhead 3
gcode:
    _ACE_TOOLCHANGE TOOL=3


# -------------------------------------------------------------------------
# Core Toolchange Orchestrator
# -------------------------------------------------------------------------
[gcode_macro _ACE_TOOLCHANGE]
description: Orchestrates tip conditioning/cutting, unloading, loading, or U1 toolhead docking
gcode:
    {% set vars = printer["gcode_macro _ACE_VARS"] %}
    {% set target_tool = params.TOOL|default(0)|int %}
    {% set cur_tool = vars.current_slot|int %}
    {% set profile = vars.platform_profile|default("voron")|lower %}
    {% set tier = vars.tier|int %}

    {% if target_tool < 0 or target_tool > 3 %}
        {action_raise_error("[ACE] Invalid tool requested: T" ~ target_tool ~ ". Must be 0-3.")}
    {% endif %}

    {% if target_tool == cur_tool %}
        M118 [ACE] Tool T{target_tool} already active in toolhead.
    {% else %}
        M118 [ACE] Toolchange initiated: T{cur_tool} -> T{target_tool} (Profile: {profile})
        SET_GCODE_VARIABLE MACRO=_ACE_VARS VARIABLE=swapping VALUE=1

        {% if profile == "snapmaker_u1" %}
            # =============================================================
            # PROFILE 2: SNAPMAKER U1 TOOL-CHANGER
            # =============================================================
            {% if vars.u1_mode|default("head")|lower == "head" %}
                # ---------------------------------------------------------
                # HEAD MODE: 1:1 Direct Feed
                # Filaments remain loaded in heads; toolchange docks old head
                # on hot seat press and picks up new head.
                # ---------------------------------------------------------
                {% if cur_tool >= 0 %}
                    _U1_HOT_SEAT_PRESS HEAD={cur_tool}
                    _U1_DOCK_HEAD HEAD={cur_tool}
                {% endif %}
                _U1_PICKUP_HEAD HEAD={target_tool}
                _U1_VERIFY_FEED HEAD={target_tool}
            {% else %}
                # ---------------------------------------------------------
                # COMBINER MODE: 4-to-1 Hub Merger on U1
                # Standard unload -> load sequence with 2100mm Bowden lengths
                # ---------------------------------------------------------
                {% if cur_tool >= 0 %}
                    ACE_UNLOAD SLOT={cur_tool}
                {% endif %}
                ACE_LOAD SLOT={target_tool}
                PURGE
                CLEAN_NOZZLE
            {% endif %}

        {% else %}
            # =============================================================
            # PROFILE 1: VORON / SINGLE-TOOLHEAD COMBINER (Tiers 1, 2, 3)
            # =============================================================
            {% if cur_tool >= 0 %}
                {% if tier == 3 %}
                    _ACE_CUT_TIP
                {% elif printer["gcode_macro CROSSBOW_CUT_TIP"] is defined %}
                    CROSSBOW_CUT_TIP
                {% else %}
                    _ACE_FORM_TIP
                {% endif %}
                ACE_UNLOAD SLOT={cur_tool}
            {% endif %}

            ACE_LOAD SLOT={target_tool}
            PURGE
            CLEAN_NOZZLE
        {% endif %}

        SET_GCODE_VARIABLE MACRO=_ACE_VARS VARIABLE=swapping VALUE=0
        SET_GCODE_VARIABLE MACRO=_ACE_VARS VARIABLE=current_slot VALUE={target_tool}
        M118 [ACE] Toolchange to T{target_tool} completed successfully.
    {% endif %}


# -------------------------------------------------------------------------
# ACE_LOAD Macro (Modular Platform & Tier Implementations)
# -------------------------------------------------------------------------
[gcode_macro ACE_LOAD]
description: Load filament from an ACE slot into the toolhead extruder
gcode:
    {% set vars = printer["gcode_macro _ACE_VARS"] %}
    {% set slot = params.SLOT|default(params.LANE|default(params.TOOL|default(0)))|int %}
    {% set profile = vars.platform_profile|default("voron")|lower %}
    {% set tier = vars.tier|int %}

    M118 [ACE] Loading Slot {slot} (Profile: {profile})...

    {% if profile == "snapmaker_u1" and vars.u1_mode|default("head")|lower == "head" %}
        # =================================================================
        # SNAPMAKER U1 HEAD MODE (1:1 Direct Feed to Toolhead 0..3)
        # -----------------------------------------------------------------
        # Dedicated 2100mm Bowden line running from ACE bay direct to head.
        # =================================================================
        {% set u1_sensor = "filament_motion_sensor e" ~ slot ~ "_filament" %}
        M118 [ACE U1 HEAD MODE] Feeding Slot {slot} to Toolhead {slot} (2100mm direct tube)...
        ACE_FEED T={slot} DISTANCE={vars.u1_bowden_len - 50.0} SPEED={vars.speed_bulk}
        # Slow approach into extruder drive gears
        M83
        G1 E25 F{vars.speed_bite * 60}
        ACE_FEED T={slot} DISTANCE=50.0 SPEED={vars.speed_bite} SENSOR={u1_sensor}

    {% elif tier == 1 %}
        # =================================================================
        # TIER 1: Minimal / 1 Sensor (Blind Feed Protocol)
        # =================================================================
        {% set lane_dist = vars.lane_lengths[slot]|float %}
        {% set total_blind_dist = lane_dist + vars.bowden_len|float + vars.entry_to_postgear|float + vars.blind_feed_margin|float %}
        M118 [ACE TIER 1] Blind feeding Slot {slot}: {total_blind_dist}mm total...
        
        ACE_FEED T={slot} DISTANCE={total_blind_dist - 50.0} SPEED={vars.speed_bulk}
        M83
        G1 E20 F{vars.speed_bite * 60}
        ACE_FEED T={slot} DISTANCE=50.0 SPEED={vars.speed_bite}
        G1 E30 F{vars.speed_bite * 60}

    {% elif tier == 2 %}
        # =================================================================
        # TIER 2: Standard / 2 Sensors (Hub + Toolhead Entry)
        # =================================================================
        M118 [ACE TIER 2] Stage 1: Advancing Slot {slot} to 4-to-1 Hub Sensor...
        ACE_FEED T={slot} SPEED={vars.speed_funnel} SENSOR={vars.sensor_hub}

        M118 [ACE TIER 2] Stage 2: Traversing {vars.bowden_len}mm Bowden to Toolhead Entry...
        ACE_FEED T={slot} DISTANCE={vars.bowden_len} SPEED={vars.speed_bowden} SENSOR={vars.sensor_entry}

        # Extruder Bite Assist
        M118 [ACE TIER 2] Engaging extruder gears...
        M83
        G1 E25 F{vars.speed_bite * 60}

    {% else %}
        # =================================================================
        # TIER 3: High-Reliability / 3 Sensors (Hub + Entry + Post-Gear)
        # =================================================================
        M118 [ACE TIER 3] Stage 1 & 2: Feeding Slot {slot} (Bulk 90mm/s -> Funnel 30mm/s)...
        ACE_FEED T={slot} DISTANCE=30.0 SPEED={vars.speed_bulk}
        ACE_FEED T={slot} SPEED={vars.speed_funnel} SENSOR={vars.sensor_hub}

        M118 [ACE TIER 3] Stage 3: High-speed Bowden transit (85mm/s)...
        ACE_FEED T={slot} DISTANCE={vars.bowden_len} SPEED={vars.speed_bowden} SENSOR={vars.sensor_entry}

        M118 [ACE TIER 3] Stage 4: Extruder gear bite assist (15mm/s synchronous drive)...
        SAVE_GCODE_STATE NAME=STATE_BITE_ENGAGE
        M83
        G1 E{vars.entry_to_postgear + 5.0} F{vars.speed_bite * 60}
        ACE_FEED T={slot} DISTANCE={vars.entry_to_postgear + 5.0} SPEED={vars.speed_bite} SENSOR={vars.sensor_postgear}
        RESTORE_GCODE_STATE NAME=STATE_BITE_ENGAGE

        {% if printer[vars.sensor_postgear] is defined %}
            {% if not printer[vars.sensor_postgear].filament_detected %}
                {action_raise_error("[ACE TIER 3 ERROR] Extruder bite failed! Post-gear sensor EMPTY after load sequence.")}
            {% else %}
                M118 [ACE TIER 3] Post-gear sensor confirmed GRIPPED. Bite verified.
            {% endif %}
        {% endif %}
    {% endif %}

    SET_GCODE_VARIABLE MACRO=_ACE_VARS VARIABLE=current_slot VALUE={slot}
    M118 [ACE] Slot {slot} loaded and verified.


# -------------------------------------------------------------------------
# ACE_UNLOAD Macro (Modular Platform & Tier Implementations)
# -------------------------------------------------------------------------
[gcode_macro ACE_UNLOAD]
description: Unload filament from toolhead back to safe park datum
gcode:
    {% set vars = printer["gcode_macro _ACE_VARS"] %}
    {% set slot = params.SLOT|default(params.LANE|default(params.TOOL|default(vars.current_slot)))|int %}
    {% set profile = vars.platform_profile|default("voron")|lower %}
    {% set tier = vars.tier|int %}

    {% if slot < 0 %}
        M118 [ACE] No active slot to unload.
    {% else %}
        M118 [ACE] Unloading Slot {slot} (Profile: {profile})...

        {% if profile == "snapmaker_u1" and vars.u1_mode|default("head")|lower == "head" %}
            # =============================================================
            # SNAPMAKER U1 HEAD MODE: Full 2100mm Eject
            # =============================================================
            M118 [ACE U1 HEAD MODE] Unloading Slot {slot} from Toolhead {slot} (2100mm Bowden)...
            M83
            G1 E-35 F1800
            ACE_RETRACT T={slot} DISTANCE={vars.u1_bowden_len + 50.0} SPEED={vars.speed_retract}

        {% elif tier == 1 %}
            # =============================================================
            # TIER 1: Full Retract into ACE Unit Bay (Parking inside ACE)
            # =============================================================
            {% set lane_dist = vars.lane_lengths[slot]|float %}
            {% set total_retract = lane_dist + vars.bowden_len|float + vars.entry_to_postgear|float + 60.0 %}
            M118 [ACE TIER 1] Retracting full Bowden line back into ACE bay ({total_retract}mm)...
            
            M83
            G1 E-35 F1800
            ACE_RETRACT T={slot} DISTANCE={total_retract} SPEED={vars.speed_retract}

        {% elif tier == 2 %}
            # =============================================================
            # TIER 2: Retract to Staged Hub Parking Datum (-50mm from Hub)
            # =============================================================
            M118 [ACE TIER 2] Cold retracting out of toolhead gears...
            M83
            G1 E-30 F1800

            M118 [ACE TIER 2] Rollback transit through Bowden until Hub Sensor clears...
            ACE_RETRACT T={slot} DISTANCE={vars.bowden_len + 30.0} SPEED={vars.speed_retract} SENSOR={vars.sensor_hub} SENSOR_STATE=0

            M118 [ACE TIER 2] Backing off {vars.hub_park_offset}mm past Hub junction to establish staged park datum...
            ACE_RETRACT T={slot} DISTANCE={vars.hub_park_offset} SPEED={vars.speed_funnel}

        {% else %}
            # =============================================================
            # TIER 3: Precision Rollback Assist & Staged Hub Park Datum
            # =============================================================
            {% if printer[vars.sensor_postgear] is defined %}
                {% if printer[vars.sensor_postgear].filament_detected %}
                    M118 [ACE TIER 3] Warning: Post-gear sensor still triggered prior to unload. Initiating cut...
                    _ACE_CUT_TIP
                {% endif %}
            {% endif %}

            M118 [ACE TIER 3] Cold pull past toolhead entry switch...
            SAVE_GCODE_STATE NAME=STATE_COLD_PULL
            M83
            G1 E-{vars.entry_to_postgear + 10.0} F2400
            RESTORE_GCODE_STATE NAME=STATE_COLD_PULL

            M118 [ACE TIER 3] Rollback assist through {vars.bowden_len}mm Bowden...
            ACE_RETRACT T={slot} DISTANCE={vars.bowden_len} SPEED={vars.speed_bowden} SENSOR={vars.sensor_hub} SENSOR_STATE=0

            M118 [ACE TIER 3] Staged parking: backing off {vars.hub_park_offset}mm outside 4-to-1 junction...
            ACE_RETRACT T={slot} DISTANCE={vars.hub_park_offset} SPEED={vars.speed_funnel}
        {% endif %}

        SET_GCODE_VARIABLE MACRO=_ACE_VARS VARIABLE=current_slot VALUE=-1
        M118 [ACE] Slot {slot} parked safely at park datum.
    {% endif %}


# -------------------------------------------------------------------------
# Snapmaker U1 Toolhead Docking & Hot Seat Press Shims (Profile 2)
# -------------------------------------------------------------------------
[gcode_macro _U1_HOT_SEAT_PRESS]
description: Engages hot seat press seal to prevent nozzle drool on docked head
gcode:
    {% set head = params.HEAD|default(0)|int %}
    M118 [U1] Engaging hot seat press for Toolhead {head}...
    SAVE_GCODE_STATE NAME=STATE_U1_HOT_SEAT
    M83
    G1 E-2 F1800  # Anti-ooze retract
    RESTORE_GCODE_STATE NAME=STATE_U1_HOT_SEAT

[gcode_macro _U1_DOCK_HEAD]
description: Parks and uncouples toolhead on Snapmaker U1 dock
gcode:
    {% set head = params.HEAD|default(0)|int %}
    {% set vars = printer["gcode_macro _ACE_VARS"] %}
    {% set dock_pos = vars.u1_dock_positions[head] %}
    M118 [U1] Docking Toolhead {head} at X{dock_pos[0]} Y{dock_pos[1]}...
    SAVE_GCODE_STATE NAME=STATE_U1_DOCK
    G90
    G1 X{dock_pos[0]} Y{dock_pos[1] - 30} F18000
    G1 Y{dock_pos[1]} F6000
    # Tool-lock latch uncouple move
    G1 Y{dock_pos[1] - 30} F12000
    RESTORE_GCODE_STATE NAME=STATE_U1_DOCK

[gcode_macro _U1_PICKUP_HEAD]
description: Coupler engages and picks up toolhead on Snapmaker U1
gcode:
    {% set head = params.HEAD|default(0)|int %}
    {% set vars = printer["gcode_macro _ACE_VARS"] %}
    {% set dock_pos = vars.u1_dock_positions[head] %}
    M118 [U1] Picking up Toolhead {head} from dock X{dock_pos[0]} Y{dock_pos[1]}...
    SAVE_GCODE_STATE NAME=STATE_U1_PICKUP
    G90
    G1 X{dock_pos[0]} Y{dock_pos[1] - 30} F18000
    G1 Y{dock_pos[1]} F6000
    # Coupler latch engage move
    G1 Y{dock_pos[1] - 30} F12000
    RESTORE_GCODE_STATE NAME=STATE_U1_PICKUP

[gcode_macro _U1_VERIFY_FEED]
description: Verifies filament is present in picked-up toolhead via motion sensor
gcode:
    {% set head = params.HEAD|default(0)|int %}
    {% set sensor = "filament_motion_sensor e" ~ head ~ "_filament" %}
    {% if printer[sensor] is defined %}
        {% if not printer[sensor].filament_detected %}
            M118 [U1 WARNING] Head {head} motion sensor reports empty filament. Loading may be needed.
        {% else %}
            M118 [U1] Head {head} filament confirmed loaded via {sensor}.
        {% endif %}
    {% endif %}


# -------------------------------------------------------------------------
# Mechanical Filament Cutting (CROSSBOW / ERCF Style Lever Cutter)
# -------------------------------------------------------------------------
[gcode_macro _ACE_CUT_TIP]
description: Mechanical tip cutting on frame pin with post-gear cut witness
gcode:
    {% set vars = printer["gcode_macro _ACE_VARS"] %}
    M118 [CUTTER] Executing mechanical tip cut sequence...

    SAVE_GCODE_STATE NAME=STATE_ACE_CUT_TIP
    G90

    # 1. Retract filament to align cutting zone with blade
    M83
    G1 E-{vars.cut_retract_dist} F3000

    # 2. Rapid traverse in XY plane to cutting pin on rear frame extrusion
    G1 X{vars.cut_x} Y{vars.cut_y} F24000

    # 3. Compress cutter arm against frame stop
    G1 X{vars.cut_pin_x} F6000
    G4 P250

    # 4. Release cutter arm
    G1 X{vars.cut_x} F12000

    # 5. Cold retract cut tip past toolhead entry sensor
    G1 E-{vars.post_cut_retract} F1800

    RESTORE_GCODE_STATE NAME=STATE_ACE_CUT_TIP

    # 6. Cut Witness Verification Check (Tier 3)
    {% if vars.tier == 3 and printer[vars.sensor_postgear] is defined %}
        {% if printer[vars.sensor_postgear].filament_detected %}
            {action_raise_error("[CUTTER ERROR] Cut witness FAILED! Post-gear sensor still triggered after cut. Blade jam or stub stuck.")}
        {% else %}
            M118 [CUTTER] Cut witness confirmed: Post-gear sensor cleared.
        {% endif %}
    {% endif %}


# Alias for compatibility with external slicers or CROSSBOW naming
[gcode_macro CROSSBOW_CUT_TIP]
description: Alias for _ACE_CUT_TIP
gcode:
    _ACE_CUT_TIP


# -------------------------------------------------------------------------
# Thermal Tip Forming Alternative (For printers without mechanical cutter)
# -------------------------------------------------------------------------
[gcode_macro _ACE_FORM_TIP]
description: Thermal ramming and tip forming fallback
gcode:
    M118 [TIP FORM] Forming filament tip in heatbreak...
    SAVE_GCODE_STATE NAME=STATE_TIP_FORM
    M83
    G1 E15 F1200
    G1 E-25 F3600
    G4 P1500
    G1 E5 F1800
    G1 E-30 F3000
    RESTORE_GCODE_STATE NAME=STATE_TIP_FORM


# -------------------------------------------------------------------------
# Auxiliary Purge & Clean Macros
# -------------------------------------------------------------------------
[gcode_macro PURGE]
description: Generic nozzle purge macro at purge bucket
gcode:
    {% set length = params.LENGTH|default(45)|float %}
    {% set vars = printer["gcode_macro _ACE_VARS"] %}
    M118 [PURGE] Purging {length}mm filament...

    SAVE_GCODE_STATE NAME=STATE_PURGE
    {% if printer.extruder.temperature < 190 %}
        M118 [PURGE] Hotend below 190C. Heating to target...
        M109 S{printer.extruder.target|default(210)|int}
    {% endif %}

    M83
    G1 E{length} F300
    G1 E-2 F1800  # Slight anti-drool retraction
    G4 P500
    RESTORE_GCODE_STATE NAME=STATE_PURGE


[gcode_macro CLEAN_NOZZLE]
description: Multi-pass silicone brush nozzle scrubbing macro
gcode:
    M118 [CLEAN] Cleaning nozzle on brush assembly...
    SAVE_GCODE_STATE NAME=STATE_CLEAN_NOZZLE
    G90

    {% set brush_y = 305.0 %}
    {% set brush_x_start = 45.0 %}
    {% set brush_x_end = 85.0 %}

    G1 X{brush_x_start} Y{brush_y} F18000

    {% for wipe in range(4) %}
        G1 X{brush_x_end} Y{brush_y} F12000
        G1 X{brush_x_start} Y{brush_y} F12000
    {% endfor %}

    RESTORE_GCODE_STATE NAME=STATE_CLEAN_NOZZLE


# -------------------------------------------------------------------------
# Bowden Calibration Dispatcher
# -------------------------------------------------------------------------
[gcode_macro ACE_CALIBRATE_LANES]
description: Calibrate Bowden length for a specific lane (or all lanes)
gcode:
    {% set lane = params.LANE|default(params.SLOT|default(-1))|int %}
    {% if lane >= 0 and lane <= 3 %}
        M118 [ACE] Calibrating Bowden length for Lane T{lane}...
        ACE_CALIBRATE_LANE LANE={lane}
    {% else %}
        M118 [ACE] Calibrating Bowden lengths across all 4 lanes...
        ACE_CALIBRATE_ALL
    {% endif %}


# -------------------------------------------------------------------------
# Staged Park Normalizer (Park at Hub)
# -------------------------------------------------------------------------
[gcode_macro ACE_PARK_LANE]
description: Advances a lane to the Hub Sensor and backs off 50mm to establish park datum
gcode:
    {% set lane = params.LANE|default(params.SLOT|default(params.TOOL|default(0)))|int %}
    {% set vars = printer["gcode_macro _ACE_VARS"] %}
    M118 [ACE] Normalizing Lane T{lane} to 50mm pre-hub park datum...

    ACE_FEED T={lane} SPEED={vars.speed_funnel} SENSOR={vars.sensor_hub}
    ACE_RETRACT T={lane} DISTANCE={vars.hub_park_offset} SPEED={vars.speed_funnel}
    M118 [ACE] Lane T{lane} normalized at park datum.
