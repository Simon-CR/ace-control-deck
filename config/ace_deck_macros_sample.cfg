# Sample Klipper Configuration for ACE Control Deck & multiACE
#
# This file provides reference macros and configuration examples
# to connect ACE Control Deck to the `decay71/multiACE` backend driver.
# 
# Instructions:
# 1. You must have the `multiACE` module installed in Klipper (https://github.com/decay71/multiACE).
# 2. You must flash the open-source custom firmware to your Anycubic ACE 2 Pro hardware.
# 3. Include this file in your printer.cfg or use it as a reference for your own toolchange macros.

# -------------------------------------------------------------------------
# Tool Mapping Shims (T0 - T3)
# -------------------------------------------------------------------------
[gcode_macro T0]
description: Select Slot 0
gcode:
    _ACE_TOOLCHANGE TOOL=0

[gcode_macro T1]
description: Select Slot 1
gcode:
    _ACE_TOOLCHANGE TOOL=1

[gcode_macro T2]
description: Select Slot 2
gcode:
    _ACE_TOOLCHANGE TOOL=2

[gcode_macro T3]
description: Select Slot 3
gcode:
    _ACE_TOOLCHANGE TOOL=3

# -------------------------------------------------------------------------
# Core Toolchange Orchestrator
# -------------------------------------------------------------------------
[gcode_macro _ACE_TOOLCHANGE]
description: Coordinate toolhead cut, unload, feed, and prime
gcode:
    {% set next_tool = params.TOOL|default(0)|int %}
    {% set cur_tool = printer["ace"].current_index|default(-1)|int if printer["ace"] is defined else -1 %}
    
    {% if next_tool != cur_tool %}
        M117 Toolchange: T{cur_tool} -> T{next_tool}
        {% if cur_tool >= 0 %}
            # Trigger tip cutting or forming before unloading
            {% if printer["gcode_macro CROSSBOW_CUT_TIP"] is defined %}
                CROSSBOW_CUT_TIP
            {% endif %}
            ACE_UNLOAD SLOT={cur_tool}
        {% endif %}
        ACE_LOAD SLOT={next_tool}
        PURGE
        CLEAN_NOZZLE
    {% endif %}

# -------------------------------------------------------------------------
# UI Action Templates (Bound in ACE Control Deck Settings Modal)
# -------------------------------------------------------------------------
[gcode_macro ACE_LOAD]
description: Load filament from a specific slot
gcode:
    {% set slot = params.SLOT|default(0)|int %}
    M118 [ACE] Loading Slot {slot}...
    # Raw multiACE driver command:
    ACE_FEED T={slot}

[gcode_macro ACE_UNLOAD]
description: Unload filament from a specific slot to park datum
gcode:
    {% set slot = params.SLOT|default(0)|int %}
    M118 [ACE] Retracting Slot {slot} to park datum...
    # Raw multiACE driver command:
    ACE_RETRACT T={slot}

[gcode_macro PURGE]
description: Generic nozzle purge macro
gcode:
    M117 Purging nozzle...
    SAVE_GCODE_STATE NAME=STATE_PURGE
    M83
    G1 E35 F300
    RESTORE_GCODE_STATE NAME=STATE_PURGE

[gcode_macro CLEAN_NOZZLE]
description: Generic nozzle wipe/clean macro
gcode:
    M117 Cleaning nozzle...
    # Customize for your brush / purge bucket XY coordinates
    # e.g., on Voron Trident:
    # G1 X45 Y305 F12000
    # G1 X85 Y305 F12000

[gcode_macro ACE_CALIBRATE_LANES]
description: Calibrate Bowden length for a specific lane (or all lanes)
gcode:
    {% set lane = params.LANE|default(-1)|int %}
    {% if lane >= 0 %}
        M118 [ACE] Running Bowden calibration for Lane T{lane}...
        # Dispatches multiACE physical calibration sequence:
        ACE_CALIBRATE_LANE LANE={lane}
    {% else %}
        M118 [ACE] Running Bowden calibration across all lanes...
        ACE_CALIBRATE_ALL
    {% endif %}
